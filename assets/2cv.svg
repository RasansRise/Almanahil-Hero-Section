  <circle cx="404" cy="150" r="4" fill="#3b4a51"/>

  <rect x="56" y="192" width="26" height="9" rx="4.5" fill="#d8dfe0"/>
  <rect x="436" y="192" width="26" height="9" rx="4.5" fill="#d8dfe0"/>
